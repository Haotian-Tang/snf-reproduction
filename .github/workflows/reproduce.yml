name: Reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Clean clone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the locked environment
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          locked: true
      - name: Recompute and validate every result
        run: pixi run reproduce
      - name: Instructor's automatic checks
        run: pixi run check-capstone
      - name: Generated files must not change the repository
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          status = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          if status:
              raise SystemExit("Reproduction changed the repository:\n" + status)
          PY
      - name: Keep the report and verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: |
            reports/snf-report.html
            results/*.png
            results/data_qc.tsv
            results/survival_comparison.tsv
            results/diagnostics.tsv
            results/repeatability.tsv
            results/config.json
            results/sessionInfo.txt
            results/validation.json
            results/provenance.json
          if-no-files-found: error
          retention-days: 30

  container:
    name: Locked container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build from the Linux lock
        run: >-
          docker build --platform linux/amd64 --provenance=false
          --build-arg VCS_REF=${{ github.sha }}
          -f containers/Dockerfile -t snf-reproduction:ci .
      - name: Reproduce inside a fresh container
        run: docker run --rm --platform linux/amd64 snf-reproduction:ci

  release:
    name: Release the verified tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [reproduce, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: results
          path: release-assets
      - name: Publish the report and checks to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/reports/snf-report.html
          release-assets/results/validation.json
          release-assets/results/provenance.json
          --verify-tag --title "SNF capstone $RELEASE_TAG"
          --notes-file docs/release-notes.md
